<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네이버 보장형 광고 상품 안내</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 히어로 -->
  <header class="hero">
    <div class="hero-inner">
      <!-- 언어 선택 -->
      <div class="lang-switch">
        <button class="lang-btn" id="lang-btn" aria-haspopup="true">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.4"/><ellipse cx="8" cy="8" rx="2.9" ry="6.4" stroke="currentColor" stroke-width="1.4"/><path d="M2 8h12M2.8 5h10.4M2.8 11h10.4" stroke="currentColor" stroke-width="1.4"/></svg>
          <span id="lang-label"></span>
        </button>
        <div class="lang-menu" id="lang-menu" role="menu"></div>
      </div>

      <span class="badge" id="hero-badge"></span>
      <h1 id="hero-title"></h1>
      <p class="meta" id="hero-meta"></p>
    </div>
  </header>

  <!-- 카테고리 빠른 이동 -->
  <nav class="quick-nav">
    <div class="quick-nav-inner" id="quick-nav"></div>
  </nav>

  <div class="wrap">
    <main id="content"><!-- data.js 기반 자동 렌더링 --></main>
    <footer class="page-footer" id="page-footer"></footer>
  </div>

  <!-- 레퍼런스 이미지 팝업 -->
  <div class="modal-backdrop" id="modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script>
    const IMG_ICON_SVG = `<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="5.5" cy="6.5" r="1.3" fill="currentColor"/><path d="M2.5 11.5L6 8.5l2.5 2 3-3 2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    let LANG = I18N.getLang();
    const ui = () => I18N.UI[LANG];
    const tr = v => I18N.tr(v, LANG);

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function cell(value, wrapOk, extraClass) {
      if (!value) return `<td class="empty">-</td>`;
      const lines = tr(String(value)).split("\n");
      const html = lines
        .map(line => line.trim().startsWith("*")
          ? `<span class="sub-note">${esc(line)}</span>`
          : esc(line))
        .join("<br>");
      const classes = [];
      if (wrapOk || lines.length > 1) classes.push("wrap-ok");
      if (extraClass) classes.push(extraClass);
      return `<td${classes.length ? ` class="${classes.join(" ")}"` : ""}>${html}</td>`;
    }

    function priceCell(p) {
      // 시간대별 단가가 있으면 별도 페이지 링크
      if (Array.isArray(p.timePricing)) {
        const label = tr(p.price) || ui().pdBadge;
        return `<td><a class="price-link" href="price-detail.html?product=${encodeURIComponent(p.id)}">${esc(label)}</a></td>`;
      }
      return cell(p.price);
    }

    function renderCategory(cat) {
      // Npay / 크림 — 외부 문서 링크 카드
      if (cat.linkRow) {
        const lr = cat.linkRow;
        const logoClass = cat.id === "npay" ? "npay" : "kream";
        const refBtn = lr.image
          ? `<button class="lc-btn lc-ref" data-img="${esc(lr.image)}" data-name="${esc(lr.imageName || lr.name)}">${esc(ui().refBtn)}</button>`
          : "";
        const linkBtns = (lr.links || []).map(l =>
          `<a class="lc-btn" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(tr(l.label))} ↗</a>`).join("");
        return `
          <section class="category" id="${esc(cat.id)}">
            <div class="category-head"><h2>${esc(tr(cat.label))}</h2></div>
            <div class="link-card">
              <span class="lc-left">
                <span class="lc-logo ${logoClass}">${logoClass === "npay" ? "N" : "Kr"}</span>
                <span>
                  <span class="lc-title">${esc(tr(lr.name))}</span>
                  <span class="lc-desc" style="display:block">${esc(tr(lr.desc || ""))}</span>
                </span>
              </span>
              <span class="lc-actions">${refBtn}${linkBtns}</span>
            </div>
          </section>`;
      }

      const rows = cat.products.map(p => `
        <tr>
          <td>
            <button class="product-name" data-id="${esc(p.id)}">
              <span class="img-icon">${IMG_ICON_SVG}</span>
              <span class="name-text">${esc(tr(p.name))}</span>
            </button>
          </td>
          ${priceCell(p)}
          ${cell(p.saleType)}
          ${cell(p.impressions)}
          ${cell(p.ctr)}
          ${cell(p.promotion, true, "promo")}
          ${cell(p.note, true)}
        </tr>`).join("");

      return `
        <section class="category" id="${esc(cat.id)}">
          <div class="category-head">
            <h2>${esc(tr(cat.label))}</h2>
          </div>
          <div class="table-card">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>${ui().cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        </section>`;
    }

    // ----- 전체 렌더링 (언어 변경 시 재호출) -----
    function renderAll() {
      const u = ui();
      document.title = u.docTitle;
      document.getElementById("hero-badge").textContent = u.badge;
      document.getElementById("hero-title").innerHTML = u.titleHtml;
      document.getElementById("hero-meta").innerHTML = [
        `${esc(u.updated)} <strong>${esc(AD_DATA.updatedAt)}</strong>`,
        `<strong>${esc(u.vatNote)}</strong>`,
        esc(u.changeNote),
        esc(u.clickNote)
      ].join(' <span class="dot">·</span> ');
      document.getElementById("page-footer").innerHTML = u.footerHtml;

      document.getElementById("content").innerHTML =
        AD_DATA.categories.map(renderCategory).join("");
      document.getElementById("quick-nav").innerHTML =
        AD_DATA.categories.map(c => `<a href="#${esc(c.id)}">${esc(tr(c.label))}</a>`).join("");

      // 언어 선택 UI
      document.getElementById("lang-label").textContent = I18N.LANG_LABELS[LANG];
      document.getElementById("lang-menu").innerHTML =
        Object.entries(I18N.LANG_LABELS).map(([code, label]) =>
          `<button data-lang="${code}" class="${code === LANG ? "active" : ""}">${label}</button>`).join("");
    }

    renderAll();
    I18N.setLang(LANG);

    // ----- 언어 선택 -----
    const langMenu = document.getElementById("lang-menu");
    document.getElementById("lang-btn").addEventListener("click", e => {
      e.stopPropagation();
      langMenu.classList.toggle("open");
    });
    langMenu.addEventListener("click", e => {
      const btn = e.target.closest("button[data-lang]");
      if (!btn) return;
      LANG = btn.dataset.lang;
      I18N.setLang(LANG);
      langMenu.classList.remove("open");
      renderAll();
    });

    // ----- 팝업 -----
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");

    function findProduct(id) {
      for (const cat of AD_DATA.categories) {
        const hit = (cat.products || []).find(p => p.id === id);
        if (hit) return hit;
      }
      return null;
    }

    function openModal(p) {
      modalTitle.textContent = tr(p.name) + ui().refSuffix;
      const img = new Image();
      img.alt = tr(p.name);
      img.onload = () => {
        modalBody.innerHTML = "";
        // 초광폭 이미지는 팝업을 넓히고 세로 기준으로 크게 표시 (좌우 스크롤)
        const ultraWide = img.naturalWidth / img.naturalHeight > 2.4;
        modal.classList.toggle("wide", ultraWide);
        modalBody.appendChild(img);
      };
      img.onerror = () => {
        modalBody.innerHTML = `<div class="img-placeholder">${esc(ui().imgPreparing)}<br><small>(${esc(p.image)})</small></div>`;
      };
      modalBody.innerHTML = `<div class="img-placeholder">${esc(ui().loading)}</div>`;
      img.src = p.image;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modal.classList.remove("open", "wide");
      modal.setAttribute("aria-hidden", "true");
    }

    document.addEventListener("click", e => {
      if (!e.target.closest(".lang-switch")) langMenu.classList.remove("open");
      const nameBtn = e.target.closest(".product-name");
      if (nameBtn) {
        const p = findProduct(nameBtn.dataset.id);
        if (p) openModal(p);
        return;
      }
      const refBtn = e.target.closest(".lc-ref");
      if (refBtn) {
        openModal({ name: refBtn.dataset.name, image: refBtn.dataset.img });
        return;
      }
      if (e.target === modal || e.target.closest(".modal-close")) closeModal();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeModal(); langMenu.classList.remove("open"); }
    });
  </script>
</body>
</html>
